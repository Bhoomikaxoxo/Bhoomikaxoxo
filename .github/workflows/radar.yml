name: Update Radar & GitHub Stats

on:
  schedule:
    # Runs every 6 hours to keep stats fresh
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-radar]
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate radar SVG
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_radar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar.svg radar.svg
          if git diff --staged --quiet; then
            echo "No changes in radar.svg"
          else
            git commit -m "chore(stats): auto-update language radar & stats"
            git push
          fi
